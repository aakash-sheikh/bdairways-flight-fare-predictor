<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BDAirways: flight fare predictor and results dashboard for a multi-target machine learning study of Bangladeshi domestic flights.">
  <meta name="theme-color" content="#1F3A5F">

  <style>
    html, body { margin: 0; background: #F3F6F9; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #F3F6F9; z-index: 10; }
    #boot img { animation: pulse 1.2s ease-in-out infinite; }

<body>
  <div id="boot"><img src="icons/Icon-192.png" width="96" height="96" alt="BDAirways"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) b.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
